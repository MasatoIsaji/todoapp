<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>ログイン</title>
	<link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body>
	<!-- ページタイトル -->
	<div class="page-title">
		<p class="page-title-text">ToDo管理システム</p>
	</div>

	<!-- フォームタイトル -->
	<div class="form-input-area-base">
		<div class="form-area">
			<div class="form-title">
				<p>ログイン</p>
			</div>

			<!-- エラー表示 -->
			<div class="message-area">
				<div th:if="${param.error}">
					<p class="error-message">ユーザー名またはパスワードが違います</p>
				</div>
				<!--ログアウト表示 -->
				<div th:if="${param.logout}">
					<p class="logout-message">ログアウトしました</p>
				</div>
				<div class="registed-area">
					<p class="registed-message" th:if="${message}" th:text="${message}"></p>
				</div>
			</div>

			<form class="form-input-area" th:action="@{/authentication}" method="post" th:object="${loginForm}">
				<div><!-- ユーザー名 -->
					<input class="input-area" type="text" th:field="*{usernameInput}" placeholder="ユーザー名">
				</div>
				<div><!-- パスワード -->
					<input class="input-area" type="password" th:field="*{passwordInput}" placeholder="パスワード">
				</div>
				<div class="loginbtn-area">
					<input class="loginbtn-icon" type="submit" value="ログイン">
				</div>
			</form>
			<div class="create-user-button">
				<a class="create-user-icon" th:href="@{/login/createUser}">新規登録</a>
			</div>
		</div>
	</div>
</body>

</html>
